services:

  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      # Points to the ollama service by its Docker Compose service name.
      # Override with OLLAMA_HOST env var if Ollama is running elsewhere.
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Cloudflare quick tunnel — only starts when explicitly requested:
  #   docker compose --profile tunnel up
  #
  # No account or domain needed. A random *.trycloudflare.com URL is
  # printed in the cloudflared container logs on startup:
  #   docker compose logs cloudflared
  #
  # Note: the URL changes on every restart. For a permanent URL,
  # switch to a named tunnel with a domain (see .env.example).
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:3001
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  # Persists downloaded Ollama models across container restarts
  ollama_data:
