# Secret scanning config — run locally with `npx gitleaks detect` or via CI.
# Extends the built-in ruleset; adds the KCL/OpenAI-style key shape that
# leaked into public/examples once (saved workflows carried node apiKey).
title = "nfcs-poc"

[extend]
useDefault = true

[[rules]]
id = "kcl-api-key"
description = "KCL inference API key (sk-…)"
regex = '''sk-[A-Za-z0-9_-]{16,}'''
keywords = ["sk-"]

[allowlist]
description = "Placeholders and lockfile hashes"
paths = [
  '''\.env\.example$''',
  '''package-lock\.json$''',
]
regexes = [
  '''sk-your-key-here''',
]
